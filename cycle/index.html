<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>המחזור שלי</title>
<style>
:root{
  --accent:#FF375F;
  --accent-15:rgba(255,55,95,.15);
  --accent-30:rgba(255,55,95,.32);
  --bg:#F2F2F7;
  --card:rgba(255,255,255,.78);
  --text:#1C1C1E;
  --text2:rgba(60,60,67,.62);
  --text3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.12);
  --pms:rgba(120,120,128,.22);
  --spring:cubic-bezier(.32,.72,0,1);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000;--card:rgba(28,28,30,.82);--text:#F2F2F7;
    --text2:rgba(235,235,245,.6);--text3:rgba(235,235,245,.28);
    --sep:rgba(84,84,88,.5);--pms:rgba(120,120,128,.36);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Rubik,"Arial Hebrew",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 32px);
  max-width:560px;margin:0 auto;
}
header{display:flex;align-items:flex-end;justify-content:space-between;margin:8px 4px 20px}
.eyebrow{font-size:13px;font-weight:600;color:var(--text2);text-transform:none;margin-bottom:2px}
h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.025em;margin:0}
.icon-btn{
  width:38px;height:38px;border-radius:50%;border:0;background:var(--card);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  box-shadow:var(--shadow);color:var(--accent);display:grid;place-items:center;cursor:pointer;
  transition:transform .35s var(--spring)
}
.icon-btn:active{transform:scale(.9)}
.card{
  background:var(--card);border-radius:22px;box-shadow:var(--shadow);
  backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);
  padding:20px;margin-bottom:14px;
  opacity:0;transform:translateY(14px) scale(.985);
  animation:rise .7s var(--spring) forwards;
}
@keyframes rise{to{opacity:1;transform:none}}
.hero{display:flex;flex-direction:column;align-items:center;padding:26px 20px 22px}
.ring-wrap{position:relative;width:220px;height:220px}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg) scaleY(-1)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-day{font-size:56px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.ring-of{font-size:13px;color:var(--text2);margin-top:4px;font-weight:500}
.phase-pill{
  margin-top:18px;padding:7px 14px;border-radius:999px;font-size:15px;font-weight:600;
  background:var(--accent-15);color:var(--accent)
}
.phase-pill.neutral{background:var(--pms);color:var(--text)}
.hero-sub{margin-top:10px;font-size:15px;color:var(--text2);text-align:center}
.hero-sub b{color:var(--text);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.grid .card{margin:0;padding:16px}
.tile-label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--text2)}
.sw{width:10px;height:10px;border-radius:50%;flex:none}
.sw.period{background:var(--accent)}
.sw.fertile{background:var(--accent-30)}
.sw.ov{background:transparent;box-shadow:inset 0 0 0 2.5px var(--accent)}
.sw.pms{background:var(--pms)}
.tile-main{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:10px;line-height:1.15}
.tile-sub{font-size:13px;color:var(--text2);margin-top:4px}
.section-title{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav{display:flex;gap:6px}
.cal-nav button{
  width:32px;height:32px;border-radius:50%;border:0;background:var(--accent-15);color:var(--accent);
  font-size:17px;cursor:pointer;display:grid;place-items:center;transition:transform .35s var(--spring)
}
.cal-nav button:active{transform:scale(.88)}
.cal-viewport{overflow:hidden;touch-action:pan-y}
.cal-track{transition:transform .55s var(--spring),opacity .35s ease}
.wk,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wk div{font-size:12px;font-weight:600;color:var(--text3);padding-bottom:8px}
.day{
  position:relative;aspect-ratio:1;display:grid;place-items:center;font-size:16px;font-weight:500;
  font-variant-numeric:tabular-nums;margin:2px;border-radius:50%
}
.day.out{visibility:hidden}
.day.period{background:var(--accent);color:#fff;font-weight:600}
.day.fertile{background:var(--accent-15);color:var(--accent);font-weight:600}
.day.ov{background:var(--accent-15);color:var(--accent);box-shadow:inset 0 0 0 2.5px var(--accent);font-weight:700}
.day.pms{background:var(--pms)}
.day.today::after{
  content:"";position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:currentColor
}
.day.today:not(.period):not(.fertile):not(.ov){color:var(--accent);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;padding-top:14px;border-top:.5px solid var(--sep)}
.legend span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2)}
.list-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:.5px solid var(--sep)}
.list-row:last-child{border-bottom:0;padding-bottom:0}
.list-row .l1{font-size:17px;font-weight:600}
.list-row .l2{font-size:13px;color:var(--text2);margin-top:2px}
.list-row .r{font-size:13px;color:var(--text2);text-align:left;line-height:1.5}
.note{font-size:12px;color:var(--text3);text-align:center;line-height:1.5;padding:4px 12px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .45s ease;z-index:9}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;z-index:10;
  background:var(--card);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);
  border-radius:28px 28px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 24px);
  transform:translateY(105%);transition:transform .55s var(--spring);box-shadow:0 -10px 40px rgba(0,0,0,.15)
}
@media (prefers-color-scheme:dark){.sheet{background:rgba(28,28,30,.94)}}
.sheet.on{transform:translateY(0)}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--text3);margin:0 auto 14px;cursor:grab}
.sheet h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
.sheet p.sub{font-size:14px;color:var(--text2);margin:0 0 18px}
.field{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:.5px solid var(--sep)}
.field label{font-size:16px;font-weight:500}
.field small{display:block;font-size:12px;color:var(--text2);font-weight:400;margin-top:2px}
input[type=date]{
  font:inherit;font-size:16px;font-weight:600;color:var(--accent);background:var(--accent-15);
  border:0;border-radius:10px;padding:7px 10px;direction:ltr
}
.stepper{display:flex;align-items:center;gap:4px;background:var(--pms);border-radius:10px;padding:3px}
.stepper button{
  width:34px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--text);
  font-size:20px;line-height:1;cursor:pointer;transition:transform .3s var(--spring),background .2s
}
.stepper button:active{transform:scale(.85);background:var(--card)}
.stepper output{min-width:30px;text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.primary{
  width:100%;margin-top:22px;height:52px;border:0;border-radius:14px;background:var(--accent);color:#fff;
  font:inherit;font-size:17px;font-weight:600;cursor:pointer;transition:transform .35s var(--spring),opacity .2s
}
.primary:active{transform:scale(.97);opacity:.9}
.empty{text-align:center;padding:40px 20px}
.empty .ring-wrap{width:120px;height:120px;margin:0 auto 18px}
</style>
</head>
<body>
<header>
  <div>
    <div class="eyebrow" id="todayLbl"></div>
    <h1>המחזור שלי</h1>
  </div>
  <button class="icon-btn" id="openSettings" aria-label="הגדרות">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  </button>
</header>

<main id="app"></main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="הגדרות מחזור">
  <div class="grabber" id="grabber"></div>
  <h2>הנתונים שלך</h2>
  <p class="sub">כל החישובים נעשים על המכשיר שלך בלבד.</p>
  <div class="field">
    <label>תחילת הווסת האחרונה<small>היום הראשון של הדימום</small></label>
    <input type="date" id="inLast">
  </div>
  <div class="field">
    <label>אורך המחזור<small>מתחילת וסת אחת לבאה</small></label>
    <div class="stepper" data-k="cycle"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div>
  </div>
  <div class="field">
    <label>אורך הווסת<small>כמה ימים נמשך הדימום</small></label>
    <div class="stepper" data-k="period"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div>
  </div>
  <div class="field" style="border-bottom:0">
    <label>ימים קשים לפני<small>כמה ימים לפני הווסת מרגישים PMS</small></label>
    <div class="stepper" data-k="pms"><button data-d="-1">−</button><output></output><button data-d="1">+</button></div>
  </div>
  <button class="primary" id="save">שמירה</button>
</div>

<script>
(function(){
const DAY=864e5;
const LIM={cycle:[21,45],period:[2,10],pms:[1,14]};
const KEY='cycle-app-v1';
const fmt=(o)=>new Intl.DateTimeFormat('he-IL',Object.assign({timeZone:'UTC'},o));
const fDM=fmt({day:'numeric',month:'long'});
const fWD=fmt({weekday:'long',day:'numeric',month:'long'});
const fMY=fmt({month:'long',year:'numeric'});
const fShort=fmt({day:'numeric',month:'short'});
const toN=(y,m,d)=>Math.floor(Date.UTC(y,m,d)/DAY);
const nDate=n=>new Date(n*DAY);
const now=new Date();
const TODAY=toN(now.getFullYear(),now.getMonth(),now.getDate());
const isoOf=n=>nDate(n).toISOString().slice(0,10);
const nOfIso=s=>{const [y,m,d]=s.split('-').map(Number);return toN(y,m-1,d)};

let st=null;
try{st=JSON.parse(localStorage.getItem(KEY))}catch(e){}
let draft=Object.assign({last:isoOf(TODAY-7),cycle:28,period:5,pms:5},st||{});
let viewY=now.getFullYear(), viewM=now.getMonth();

document.getElementById('todayLbl').textContent=fWD.format(nDate(TODAY));

/* ---- model ---- */
function phaseAt(n,s){
  const L=nOfIso(s.last),C=s.cycle;
  const off=n-L,k=Math.floor(off/C),i=off-k*C;
  if(i<s.period) return 'period';
  if(i===C-14) return 'ov';
  if(i>=C-19&&i<=C-13) return 'fertile';
  if(i>=C-s.pms) return 'pms';
  return '';
}
function cycleInfo(s){
  const L=nOfIso(s.last),C=s.cycle;
  const k=Math.max(0,Math.floor((TODAY-L)/C));
  const start=L+k*C, idx=TODAY-start, next=start+C;
  return {start,idx,next,C,
    ov:start+C-14, fStart:start+C-19, fEnd:start+C-13,
    pmsStart:next-s.pms, pEnd:start+s.period-1};
}
const inDays=d=>d===0?'היום':d===1?'מחר':d===2?'מחרתיים':d<0?(d===-1?'אתמול':`לפני ${-d} ימים`):`בעוד ${d} ימים`;
const range=(a,b)=>{
  const A=nDate(a),B=nDate(b);
  return A.getUTCMonth()===B.getUTCMonth()?`${A.getUTCDate()}–${B.getUTCDate()} ב${fmt({month:'long'}).format(B)}`:`${fShort.format(A)} – ${fShort.format(B)}`;
};

/* ---- ring ---- */
function ring(s,ci,size){
  const r=88,c=2*Math.PI*r,C=s.cycle,g=1.2;
  const seg=(a,len,col)=>`<circle cx="100" cy="100" r="${r}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${Math.max(0.01,len/C*c-14-g)} ${c}" stroke-dashoffset="${-(a/C*c+7+g/2)}"/>`;
  let out=`<circle cx="100" cy="100" r="${r}" fill="none" stroke="var(--sep)" stroke-width="14"/>`;
  out+=seg(C-s.pms,s.pms,'var(--pms)');
  out+=seg(C-19,7,'var(--accent-30)');
  out+=seg(0,s.period,'var(--accent)');
  if(ci){
    const a=(ci.idx+.5)/C*2*Math.PI;
    const x=100+r*Math.cos(a),y=100+r*Math.sin(a);
    out+=`<circle cx="${x}" cy="${y}" r="11" fill="var(--card)" stroke="var(--text)" stroke-width="3"/>`;
  }
  return `<svg viewBox="0 0 200 200">${out}</svg>`;
}

/* ---- render ---- */
const app=document.getElementById('app');
function render(){
  if(!st){
    app.innerHTML=`<section class="card empty">
      <div class="ring-wrap">${ring(draft,null)}</div>
      <h2 class="section-title">בואי נתחיל</h2>
      <p class="hero-sub">הזיני את תאריך הווסת האחרונה ואורך המחזור, והאפליקציה תחשב את כל השאר.</p>
      <button class="primary" id="startBtn">הזנת נתונים</button></section>`;
    document.getElementById('startBtn').onclick=openSheet;
    return;
  }
  const s=st,ci=cycleInfo(s),ph=phaseAt(TODAY,s);
  const names={period:'וסת',ov:'יום הביוץ',fertile:'חלון פוריות',pms:'ימים קשים (PMS)','':'שלב רגוע'};
  const untilNext=ci.next-TODAY;
  let sub;
  if(ph==='period') sub=`יום <b>${ci.idx+1}</b> של הווסת · צפויה להסתיים <b>${inDays(ci.pEnd-TODAY)}</b>`;
  else sub=`הווסת הבאה <b>${inDays(untilNext)}</b>, ${fWD.format(nDate(ci.next))}`;

  // upcoming ov/fertile: if this cycle's already passed, show next cycle's
  const ovThis=ci.ov>=TODAY-1;
  const ov=ovThis?ci.ov:ci.ov+s.cycle, fS=ovThis?ci.fStart:ci.fStart+s.cycle, fE=ovThis?ci.fEnd:ci.fEnd+s.cycle;
  const pS=ci.pmsStart, pE=ci.next-1;

  let html=`
  <section class="card hero" style="animation-delay:0s">
    <div class="ring-wrap">${ring(s,ci)}
      <div class="ring-center"><div class="ring-day">${ci.idx+1}</div><div class="ring-of">יום במחזור מתוך ${s.cycle}</div></div>
    </div>
    <div class="phase-pill ${ph===''||ph==='pms'?'neutral':''}">${names[ph]}</div>
    <div class="hero-sub">${sub}</div>
  </section>
  <div class="grid">
    ${tile('period','הווסת הבאה',fDM.format(nDate(ci.next)),`${inDays(untilNext)} · כ־${s.period} ימים`,.06)}
    ${tile('ov','ביוץ משוער',fDM.format(nDate(ov)),inDays(ov-TODAY),.1)}
    ${tile('fertile','חלון פוריות',range(fS,fE),TODAY>=fS&&TODAY<=fE?'עכשיו':inDays(fS-TODAY),.14)}
    ${tile('pms','ימים קשים',range(pS,pE),TODAY>=pS&&TODAY<=pE?'עכשיו':inDays(pS-TODAY),.18)}
  </div>
  <section class="card" style="animation-delay:.22s">
    <div class="cal-head">
      <h2 class="section-title" id="calTitle"></h2>
      <div class="cal-nav"><button id="prevM" aria-label="חודש קודם">›</button><button id="nextM" aria-label="חודש הבא">‹</button></div>
    </div>
    <div class="cal-viewport" id="calVp"><div class="cal-track" id="calTrack"></div></div>
    <div class="legend">
      <span><i class="sw period"></i>וסת</span><span><i class="sw fertile"></i>חלון פוריות</span>
      <span><i class="sw ov"></i>ביוץ</span><span><i class="sw pms"></i>ימים קשים</span>
    </div>
  </section>
  <section class="card" style="animation-delay:.28s">
    <h2 class="section-title" style="margin-bottom:4px">המחזורים הקרובים</h2>
    ${upcoming(s,ci)}
  </section>
  <p class="note">התחזית מבוססת על ממוצעים ומניחה ביוץ כ־14 יום לפני הווסת. מחזורים משתנים, ולכן אין להשתמש בה כאמצעי מניעה.</p>`;
  app.innerHTML=html;
  drawCal(0);
  document.getElementById('prevM').onclick=()=>shift(-1);
  document.getElementById('nextM').onclick=()=>shift(1);
  swipe(document.getElementById('calVp'));
}
function tile(cls,label,main,sub,delay){
  return `<div class="card" style="animation-delay:${delay}s"><div class="tile-label"><i class="sw ${cls}"></i>${label}</div>
  <div class="tile-main">${main}</div><div class="tile-sub">${sub}</div></div>`;
}
function upcoming(s,ci){
  let r='';
  for(let k=1;k<=6;k++){
    const st0=ci.start+k*s.cycle, ov=st0-14;
    r+=`<div class="list-row"><div><div class="l1">${fDM.format(nDate(st0))}</div><div class="l2">${fmt({weekday:'long'}).format(nDate(st0))} · ${inDays(st0-TODAY)}</div></div>
    <div class="r">ביוץ ${fShort.format(nDate(ov))}<br>פוריות ${fShort.format(nDate(ov-5))}–${fShort.format(nDate(ov+1))}</div></div>`;
  }
  return r;
}

/* ---- calendar ---- */
function drawCal(dir){
  const track=document.getElementById('calTrack');
  document.getElementById('calTitle').textContent=fMY.format(nDate(toN(viewY,viewM,1)));
  const first=toN(viewY,viewM,1), dow=nDate(first).getUTCDay(), len=new Date(Date.UTC(viewY,viewM+1,0)).getUTCDate();
  let h='<div class="wk">'+['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'].map(d=>`<div>${d}</div>`).join('')+'</div><div class="days">';
  for(let i=0;i<dow;i++) h+='<div class="day out"></div>';
  const L=nOfIso(st.last);
  for(let d=1;d<=len;d++){
    const n=first+d-1;
    const p=n>=L-st.cycle*12?phaseAt(n,st):'';
    h+=`<div class="day ${p} ${n===TODAY?'today':''}">${d}</div>`;
  }
  h+='</div>';
  if(!dir){track.innerHTML=h;return}
  track.style.transition='none';
  track.style.transform=`translateX(${dir>0?-40:40}px)`;track.style.opacity='0';
  track.innerHTML=h;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    track.style.transition='';track.style.transform='';track.style.opacity='1';
  }));
}
function shift(d){viewM+=d;if(viewM<0){viewM=11;viewY--}if(viewM>11){viewM=0;viewY++}drawCal(d)}
function swipe(el){
  let x0=null,dx=0;const track=el.firstElementChild;
  el.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0;track.style.transition='none'});
  el.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;track.style.transform=`translateX(${dx*.6}px)`});
  const end=()=>{if(x0===null)return;x0=null;track.style.transition='';
    if(Math.abs(dx)>50) shift(dx>0?1:-1); else track.style.transform='';};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('pointerleave',end);
}

/* ---- sheet ---- */
const sheet=document.getElementById('sheet'),scrim=document.getElementById('scrim'),inLast=document.getElementById('inLast');
inLast.max=isoOf(TODAY);
function syncSheet(){
  inLast.value=draft.last;
  document.querySelectorAll('.stepper').forEach(s=>s.querySelector('output').textContent=draft[s.dataset.k]);
}
function openSheet(){draft=Object.assign({},st||draft);syncSheet();sheet.style.transform='';sheet.classList.add('on');scrim.classList.add('on')}
function closeSheet(){sheet.classList.remove('on');scrim.classList.remove('on');sheet.style.transform=''}
document.getElementById('openSettings').onclick=openSheet;
scrim.onclick=closeSheet;
document.querySelectorAll('.stepper').forEach(s=>{
  s.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    const k=s.dataset.k,[lo,hi]=LIM[k];
    draft[k]=Math.min(hi,Math.max(lo,draft[k]+Number(b.dataset.d)));
    s.querySelector('output').textContent=draft[k];
  });
});
inLast.addEventListener('change',()=>{if(inLast.value)draft.last=inLast.value});
document.getElementById('save').onclick=()=>{
  if(!inLast.value||nOfIso(inLast.value)>TODAY){inLast.focus();return}
  draft.last=inLast.value;
  st=Object.assign({},draft);
  try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}
  viewY=now.getFullYear();viewM=now.getMonth();
  closeSheet();render();
};
// drag sheet down to dismiss
(function(){
  const g=document.getElementById('grabber');let y0=null,dy=0;
  g.addEventListener('pointerdown',e=>{y0=e.clientY;sheet.style.transition='none';g.setPointerCapture(e.pointerId)});
  g.addEventListener('pointermove',e=>{if(y0===null)return;dy=Math.max(0,e.clientY-y0);sheet.style.transform=`translateY(${dy}px)`});
  g.addEventListener('pointerup',()=>{y0=null;sheet.style.transition='';if(dy>90)closeSheet();else sheet.style.transform='';dy=0});
})();

render();
})();
</script>
</body>
</html>
